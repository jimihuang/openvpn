name: goreleaser

on:
  push:
    tags:
      - '*'

jobs:
  goreleaser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'src/openvpn-web/go.mod'

      - uses: oven-sh/setup-bun@v2

      - name: Build Web UI
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
          rm -rf ../src/openvpn-web/webdist
          mkdir -p ../src/openvpn-web/webdist
          cp -R dist/. ../src/openvpn-web/webdist/

      - name: Build container binaries
        working-directory: src/openvpn-web
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../../build/openvpn-web-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o ../../build/openvpn-web-linux-arm64 .

      - name: Build openvpn-web
        uses: goreleaser/goreleaser-action@v6
        with:
          workdir: src/openvpn-web
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.ACTION_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Version
        run: echo VERSION=`git describe --tags --always` >> $GITHUB_ENV

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./build
          file: ./build/Dockerfile
          push: true
          platforms: |
            linux/amd64
            linux/arm64

          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/openvpn:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/openvpn:${{ env.VERSION }}
