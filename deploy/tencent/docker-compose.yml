services:
  openvpn:
    image: registry.cn-beijing.aliyuncs.com/t3t3/openvpn-web:20260721-https
    container_name: openvpn-web
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "1194:1194/tcp"
      - "8833:8833/tcp"
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ "$$(jq -r '.system.base.https_enabled // false' /data/config.json)" = "true" ]; then
            curl -kfsS --max-time 5 https://127.0.0.1:8833/login >/dev/null;
          else
            curl -fsS --max-time 5 http://127.0.0.1:8833/login >/dev/null;
          fi
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
