# 新 UI 审阅环境:nginx 托管构建产物,加入 openvpn-web 的 docker 网络做 API 反代
# 用法: 把 web/dist、本目录的 nginx.conf 与本文件放到部署目录后 docker compose up -d
services:
  ui:
    image: nginx:alpine
    container_name: openvpn-web-ui
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - openvpn-web_default

networks:
  openvpn-web_default:
    external: true
